<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FSTB Game Boy Escape Room</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 15px 10px;
    }

    /* Rangka Utama Game Boy Color Emulator */
    #gameboy {
      background: #6b21a8; /* Warna Purple Game Boy Retro */
      border: 5px solid #4c1d95;
      border-bottom-width: 14px;
      border-radius: 24px 24px 55px 24px;
      padding: 18px 16px 28px 16px;
      width: 360px;
      max-width: 100%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8), inset 0 -8px 15px rgba(0,0,0,0.4);
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    /* Bezel Skrin Game Boy */
    #screen-bezel {
      background: #1e293b;
      border-radius: 12px 12px 35px 12px;
      padding: 14px 14px 10px 14px;
      width: 100%;
      box-shadow: inset 0 0 12px rgba(0,0,0,0.9);
    }
    
    .screen-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #94a3b8;
      font-size: 0.65rem;
      font-weight: bold;
      margin-bottom: 8px;
      letter-spacing: 1px;
    }
    .power-led {
      width: 8px; height: 8px;
      background: #ef4444;
      border-radius: 50%;
      box-shadow: 0 0 8px #ef4444;
      display: inline-block;
      margin-right: 5px;
    }

    /* Skrin Canvas LCD Game Boy */
    #canvas-container {
      position: relative;
      background: #8b9bb4;
      border: 4px solid #0f172a;
      border-radius: 4px;
      overflow: hidden;
    }
    canvas { display: block; background: #8b9bb4; image-rendering: pixelated; }

    /* Bar Status Skrin */
    #gb-status {
      display: flex;
      justify-content: space-between;
      background: #0f172a;
      color: #38bdf8;
      font-size: 0.7rem;
      padding: 4px 8px;
      font-weight: bold;
    }

    .brand-title {
      color: #cbd5e1;
      font-size: 0.85rem;
      font-weight: bold;
      font-style: italic;
      margin-top: 8px;
      text-align: center;
      letter-spacing: 2px;
    }
    .brand-title span { color: #ec4899; }

    /* Modal Terminal Soalan LCD Retro */
    #terminal-modal {
      display: none;
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: #064e3b;
      border-radius: 2px;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 10px;
      text-align: center;
      z-index: 20;
    }
    #terminal-modal.active { display: flex; }
    .term-title { color: #f59e0b; font-size: 0.7rem; font-weight: bold; }
    .term-question { 
      font-size: 0.72rem; 
      color: #a7f3d0; 
      line-height: 1.35; 
      text-align: left; 
      background: #022c22; 
      padding: 8px; 
      border-radius: 4px; 
      border: 1px solid #059669; 
      width: 100%;
    }
    .term-input {
      width: 100%;
      padding: 6px;
      background: #0284c7;
      border: 2px solid #38bdf8;
      color: #ffffff;
      font-family: monospace;
      font-size: 1.1rem;
      border-radius: 4px;
      text-align: center;
      font-weight: bold;
    }
    .term-btn {
      background: #22c55e;
      color: #052e16;
      border: none;
      padding: 6px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.75rem;
      width: 100%;
    }

    /* KAWALAN EMULATOR (D-Pad & Action Buttons) */
    #controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      margin-top: 18px;
      padding: 0 10px;
    }

    /* D-PAD (+) */
    .dpad {
      display: grid;
      grid-template-columns: repeat(3, 34px);
      grid-template-rows: repeat(3, 34px);
    }
    .btn-dpad {
      background: #334155;
      border: 1px solid #1e293b;
      color: #cbd5e1;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: inset 0 2px 4px rgba(255,255,255,0.15);
    }
    .btn-dpad:active { background: #0f172a; }
    .dpad-up { grid-column: 2; grid-row: 1; border-radius: 5px 5px 0 0; }
    .dpad-left { grid-column: 1; grid-row: 2; border-radius: 5px 0 0 5px; }
    .dpad-center { grid-column: 2; grid-row: 2; background: #334155; }
    .dpad-right { grid-column: 3; grid-row: 2; border-radius: 0 5px 5px 0; }
    .dpad-down { grid-column: 2; grid-row: 3; border-radius: 0 0 5px 5px; }

    /* BUTANG A & B */
    .action-buttons {
      display: flex;
      gap: 12px;
      transform: rotate(-15deg);
    }
    .btn-action {
      width: 44px; height: 44px;
      border-radius: 50%;
      background: #dc2626;
      border: 3px solid #991b1b;
      color: white;
      font-weight: bold;
      font-size: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 0 #7f1d1d, inset 0 2px 4px rgba(255,255,255,0.3);
      cursor: pointer;
    }
    .btn-action:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #7f1d1d;
    }

    /* BUTANG SELECT & START */
    .meta-buttons {
      display: flex;
      gap: 15px;
      margin-top: 15px;
    }
    .btn-pill {
      width: 45px; height: 12px;
      background: #475569;
      border-radius: 10px;
      transform: rotate(-25deg);
      cursor: pointer;
      border: 1px solid #1e293b;
      box-shadow: inset 0 1px 2px rgba(255,255,255,0.2);
    }
    .btn-pill:active { background: #1e293b; }
    .pill-label {
      font-size: 0.6rem;
      color: #cbd5e1;
      text-align: center;
      margin-top: 2px;
      font-weight: bold;
    }

    #controls-info {
      margin-top: 15px;
      font-size: 0.72rem;
      color: #94a3b8;
      text-align: center;
    }
  </style>
</head>
<body>

  <div id="gameboy">
    <!-- Bezel Skrin Game Boy -->
    <div id="screen-bezel">
      <div class="screen-header">
        <div><span class="power-led"></span>POWER</div>
        <div style="font-size:0.55rem;">DOT MATRIX WITH STEREO SOUND</div>
      </div>

      <!-- Canvas LCD -->
      <div id="canvas-container">
        <div id="gb-status">
          <div>STAGE: <span id="room-num" style="color:#f59e0b">1</span>/5</div>
          <div>PINTU: <span id="door-status" style="color:#ef4444">KUNCI</span></div>
        </div>
        <canvas id="gameCanvas" width="300" height="210"></canvas>

        <!-- Terminal Modal Soalan -->
        <div id="terminal-modal">
          <div class="term-title">💻 TERMINAL PINTU BILIK <span id="modal-room">1</span></div>
          <div class="term-question" id="modal-q">Cari FSTB...</div>
          <input type="number" id="passcode-input" class="term-input" placeholder="MASUKKAN FSTB" autocomplete="off">
          <button class="term-btn" onclick="submitPasscode()">[ BUTANG A ] HANTAR JAWAPAN</button>
        </div>
      </div>

      <div class="brand-title">GAME BOY <span>COLOR</span></div>
    </div>

    <!-- Kawalan Emulator (D-Pad & Buttons) -->
    <div id="controls">
      <!-- D-Pad -->
      <div class="dpad">
        <div class="btn-dpad dpad-up" onmousedown="startMove(0,-1)" onmouseup="stopMove()" ontouchstart="startMove(0,-1)" ontouchend="stopMove()">▲</div>
        <div class="btn-dpad dpad-left" onmousedown="startMove(-1,0)" onmouseup="stopMove()" ontouchstart="startMove(-1,0)" ontouchend="stopMove()">◄</div>
        <div class="btn-dpad dpad-center"></div>
        <div class="btn-dpad dpad-right" onmousedown="startMove(1,0)" onmouseup="stopMove()" ontouchstart="startMove(1,0)" ontouchend="stopMove()">►</div>
        <div class="btn-dpad dpad-down" onmousedown="startMove(0,1)" onmouseup="stopMove()" ontouchstart="startMove(0,1)" ontouchend="stopMove()">▼</div>
      </div>

      <!-- Action Buttons -->
      <div class="action-buttons">
        <div class="btn-action" onclick="interact()">B</div>
        <div class="btn-action" onclick="interact()">A</div>
      </div>
    </div>

    <!-- Select & Start -->
    <div class="meta-buttons">
      <div>
        <div class="btn-pill" onclick="restartGame()"></div>
        <div class="pill-label">RESET</div>
      </div>
      <div>
        <div class="btn-pill" onclick="interact()"></div>
        <div class="pill-label">START</div>
      </div>
    </div>
  </div>

  <div id="controls-info">Guna Keyboard (**W, A, S, D** / **Arrow Keys** & **Space / E**) atau Touch Screen.</div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

// ==========================================
// BANK SOALAN RAWAK FSTB (MATEMATIK TINGKATAN 1)
// ==========================================
const questionPool = {
  // Stage 1: Nombor Kecil
  1: [
    { q: "Cari Faktor Sepunya Terbesar (FSTB) bagi 8 dan 12.", code: "4" },
    { q: "Cari Faktor Sepunya Terbesar (FSTB) bagi 12 dan 18.", code: "6" },
    { q: "Cari Faktor Sepunya Terbesar (FSTB) bagi 10 dan 25.", code: "5" },
    { q: "Cari Faktor Sepunya Terbesar (FSTB) bagi 14 dan 21.", code: "7" },
    { q: "Cari Faktor Sepunya Terbesar (FSTB) bagi 16 dan 24.", code: "8" }
  ],
  // Stage 2: Nombor Sederhana
  2: [
    { q: "Cari Faktor Sepunya Terbesar (FSTB) bagi 24 dan 36.", code: "12" },
    { q: "Cari Faktor Sepunya Terbesar (FSTB) bagi 30 dan 45.", code: "15" },
    { q: "Cari Faktor Sepunya Terbesar (FSTB) bagi 20 dan 50.", code: "10" },
    { q: "Cari Faktor Sepunya Terbesar (FSTB) bagi 36 dan 54.", code: "18" },
    { q: "Cari Faktor Sepunya Terbesar (FSTB) bagi 28 dan 42.", code: "14" }
  ],
  // Stage 3: Tiga Nombor
  3: [
    { q: "Cari FSTB bagi tiga nombor: 12, 18, dan 24.", code: "6" },
    { q: "Cari FSTB bagi tiga nombor: 15, 30, dan 45.", code: "15" },
    { q: "Cari FSTB bagi tiga nombor: 16, 32, dan 48.", code: "16" },
    { q: "Cari FSTB bagi tiga nombor: 20, 40, dan 60.", code: "20" },
    { q: "Cari FSTB bagi tiga nombor: 18, 27, dan 36.", code: "9" }
  ],
  // Stage 4: Nombor Lebih Besar
  4: [
    { q: "Cari FSTB bagi nombor 32, 48, dan 80.", code: "16" },
    { q: "Cari FSTB bagi nombor 36, 54, dan 90.", code: "18" },
    { q: "Cari FSTB bagi nombor 28, 56, dan 84.", code: "28" },
    { q: "Cari FSTB bagi nombor 45, 75, dan 105.", code: "15" },
    { q: "Cari FSTB bagi nombor 48, 72, dan 120.", code: "24" }
  ],
  // Stage 5: Cabaran Akhir FSTB
  5: [
    { q: "Soalan Akhir! Cari FSTB bagi 56, 84, dan 140.", code: "28" },
    { q: "Soalan Akhir! Cari FSTB bagi 64, 96, dan 160.", code: "32" },
    { q: "Soalan Akhir! Cari FSTB bagi 60, 90, dan 150.", code: "30" },
    { q: "Soalan Akhir! Cari FSTB bagi 72, 108, dan 180.", code: "36" },
    { q: "Soalan Akhir! Cari FSTB bagi 84, 126, dan 210.", code: "42" }
  ]
};

let currentRoom = 0;
let sessionQuestions = [];
let doorUnlocked = false;
let isTerminalOpen = false;

// Penjanaan Set Soalan Rawak untuk Sesi Main Ini
function generateSessionQuestions() {
  sessionQuestions = [];
  for (let stage = 1; stage <= 5; stage++) {
    const list = questionPool[stage];
    const randomChoice = list[Math.floor(Math.random() * list.length)];
    sessionQuestions.push(randomChoice);
  }
}

// State Karakter & Objek Bilik
const player = { x: 40, y: 105, size: 10, speed: 2.2 };
const terminal = { x: 130, y: 22, w: 32, h: 22 };
const door = { x: 280, y: 80, w: 12, h: 50 };

function interact() {
  if (isTerminalOpen) {
    submitPasscode();
    return;
  }
  let dist = Math.hypot((player.x) - (terminal.x + terminal.w/2), (player.y) - (terminal.y + terminal.h/2));
  if (dist < 38) {
    openTerminal();
  }
}

function openTerminal() {
  isTerminalOpen = true;
  const currentQ = sessionQuestions[currentRoom];
  document.getElementById("modal-room").innerText = currentRoom + 1;
  document.getElementById("modal-q").innerText = currentQ.q;
  document.getElementById("passcode-input").value = "";
  document.getElementById("terminal-modal").classList.add("active");
  setTimeout(() => document.getElementById("passcode-input").focus(), 100);
}

function submitPasscode() {
  const input = document.getElementById("passcode-input").value.trim();
  const currentQ = sessionQuestions[currentRoom];

  if (input === currentQ.code) {
    alert("SYABAS! Jawapan FSTB Betul! Pintu Nyahterkunci.");
    doorUnlocked = true;
    document.getElementById("door-status").innerText = "BUKA";
    document.getElementById("door-status").style.color = "#4ade80";
    document.getElementById("terminal-modal").classList.remove("active");
    isTerminalOpen = false;
  } else {
    alert("JAWAPAN SALAH! Sila semak semula pengiraan FSTB anda.");
  }
}

function restartGame() {
  currentRoom = 0;
  doorUnlocked = false;
  isTerminalOpen = false;
  player.x = 40;
  player.y = 105;
  document.getElementById("room-num").innerText = "1";
  document.getElementById("door-status").innerText = "KUNCI";
  document.getElementById("door-status").style.color = "#ef4444";
  document.getElementById("terminal-modal").classList.remove("active");
  
  // Jana set soalan baharu yang berbeza!
  generateSessionQuestions();
  alert("GAME DENGAN SET SOALAN BAHARU DIMULAKAN!");
}

// Pergerakan Touch Control
let moveInterval = null;
function startMove(dx, dy) {
  if (moveInterval) clearInterval(moveInterval);
  movePlayer(dx, dy);
  moveInterval = setInterval(() => movePlayer(dx, dy), 40);
}
function stopMove() {
  if (moveInterval) clearInterval(moveInterval);
}

const keys = {};
window.addEventListener("keydown", (e) => {
  keys[e.key.toLowerCase()] = true;
  if (e.key === "a" || e.key === "A" || e.key === "e" || e.key === "E" || e.key === " ") {
    interact();
  }
});
window.addEventListener("keyup", (e) => { keys[e.key.toLowerCase()] = false; });

function movePlayer(dx, dy) {
  if (isTerminalOpen) return;
  let nextX = player.x + dx * player.speed;
  let nextY = player.y + dy * player.speed;

  if (nextX - player.size > 12 && nextX + player.size < canvas.width - 12) player.x = nextX;
  if (nextY - player.size > 12 && nextY + player.size < canvas.height - 12) player.y = nextY;
}

function update() {
  if (isTerminalOpen) return;

  if (keys["w"] || keys["arrowup"]) movePlayer(0, -1);
  if (keys["s"] || keys["arrowdown"]) movePlayer(0, 1);
  if (keys["a"] || keys["arrowleft"]) movePlayer(-1, 0);
  if (keys["d"] || keys["arrowright"]) movePlayer(1, 0);

  // Semak jika jalan melepasi pintu
  if (player.x + player.size >= door.x && player.y > door.y && player.y < door.y + door.h) {
    if (doorUnlocked) {
      currentRoom++;
      if (currentRoom >= 5) {
        alert("TAHNIAH! Anda berjaya tamatkan kesemua 5 bilik FSTB! Permainan akan mula semula dengan set soalan baharu.");
        restartGame();
        return;
      }
      player.x = 40;
      player.y = 105;
      doorUnlocked = false;
      document.getElementById("room-num").innerText = currentRoom + 1;
      document.getElementById("door-status").innerText = "KUNCI";
      document.getElementById("door-status").style.color = "#ef4444";
    }
  }
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Lantai Bilik Retro LCD
  ctx.fillStyle = "#8b9bb4";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Garis Grid Lantai
  ctx.strokeStyle = "#7b8b9f";
  ctx.lineWidth = 1;
  for (let x = 0; x < canvas.width; x += 20) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
  }
  for (let y = 0; y < canvas.height; y += 20) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
  }

  // Dinding Bilik
  ctx.strokeStyle = "#0f172a";
  ctx.lineWidth = 8;
  ctx.strokeRect(4, 4, canvas.width - 8, canvas.height - 8);

  // Pintu Bilik
  ctx.fillStyle = doorUnlocked ? "#22c55e" : "#ef4444";
  ctx.fillRect(door.x, door.y, door.w, door.h);

  // Terminal Komputer
  ctx.fillStyle = "#0284c7";
  ctx.fillRect(terminal.x, terminal.y, terminal.w, terminal.h);
  ctx.fillStyle = "#38bdf8";
  ctx.fillRect(terminal.x + 3, terminal.y + 3, terminal.w - 6, terminal.h - 8);

  // Watak Karakter 8-Bit
  ctx.fillStyle = "#0f172a"; // Baju
  ctx.fillRect(player.x - 6, player.y - 6, 12, 12);
  ctx.fillStyle = "#fbcfe8"; // Muka
  ctx.fillRect(player.x - 4, player.y - 8, 8, 6);
  ctx.fillStyle = "#ec4899"; // Topi Pink Retro
  ctx.fillRect(player.x - 5, player.y - 11, 10, 4);
}

function gameLoop() {
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

// Mula perlawanan pertama
generateSessionQuestions();
gameLoop();
</script>
</body>
</html>
