
<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Misi Escape Room: Kod FSTB</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101827;color:white;font-family:Arial;text-align:center}
header{background:#20304e;padding:15px 5px}
h1{font-size:23px;color:#ffd166;margin:4px}
#stats{padding:12px;display:flex;justify-content:center;gap:16px;flex-wrap:wrap}
#stage{color:#ffd166;font-weight:bold}
#maze{display:grid;grid-template-columns:repeat(11,min(8.3vw,48px));gap:3px;justify-content:center;margin:12px auto}
.cell{width:min(8.3vw,48px);height:min(8.3vw,48px);display:flex;align-items:center;justify-content:center;font-size:clamp(16px,4.5vw,26px);background:#29464a;border:1px solid #36575a}
.wall{background:#7789ad}
.player{background:#f6c85f}
.question{background:#9b7ede}
.door{background:#b74659}
#message{color:#ffd166;font-weight:bold;min-height:35px;padding:8px}
#controls{display:grid;grid-template-columns:repeat(3,58px);gap:6px;justify-content:center}
button{border:0;border-radius:9px;padding:13px;background:#3169c6;color:white;font-size:18px;font-weight:bold}
#controls button{height:50px}
#panel{display:none;position:fixed;inset:0;background:#000c;align-items:center;justify-content:center;padding:18px;z-index:2}
#box{background:#20304e;padding:22px;border-radius:15px;width:min(100%,360px)}
#questionText{line-height:1.6}
input{width:90%;padding:12px;border:0;border-radius:7px;font-size:18px;margin:10px}
#send{width:95%;font-size:16px}
small{color:#cbd5e1}
</style>
</head>
<body>
<header>
<h1>🔐 MISI ESCAPE ROOM</h1>
<div>KOD FSTB · Matematik Tingkatan 1</div>
</header>

<div id="stats">
<span id="stage">Stage 1/5</span>
<span>❤️ Nyawa: <b id="lives">3</b></span>
<span>⭐ Markah: <b id="score">0</b></span>
<span>⏱️ Masa: <b id="time">120</b>s</span>
</div>

<div id="maze"></div>
<div id="message">Cari soalan, jawab dengan betul dan cari pintu!</div>

<div id="controls">
<span></span><button onclick="move(0,-1)">⬆️</button><span></span>
<button onclick="move(-1,0)">⬅️</button>
<button onclick="move(0,1)">⬇️</button>
<button onclick="move(1,0)">➡️</button>
</div>
<p><small>Guna butang arah atau kekunci anak panah / WASD.</small></p>
<button onclick="restart()" style="font-size:15px">🔄 Mula Semula</button>

<div id="panel">
<div id="box">
<h2 id="panelTitle">🔐 Soalan Stage 1</h2>
<p id="questionText"></p>
<input id="answer" type="number" inputmode="numeric" placeholder="Taip jawapan di sini">
<button id="send" onclick="checkAnswer()">Hantar Jawapan</button>
<p id="feedback"></p>
</div>
</div>

<script>
const maps=[
[
"###########",
"#P..#....D#",
"###.#.##..#",
"#...#.....#",
"#.###.###.#",
"#Q........#",
"###########"
],
[
"###########",
"#P....#...#",
"###.#.#.#D#",
"#...#...#.#",
"#.#####.#.#",
"#Q........#",
"###########"
],
[
"###########",
"#P..#.....#",
"#.#.#.###.#",
"#.#...#...#",
"#.###.#.#D#",
"#Q........#",
"###########"
],
[
"###########",
"#P....#...#",
"#.##..#.#D#",
"#....##.#.#",
"####....#.#",
"#Q........#",
"###########"
],
[
"###########",
"#P..#.....#",
"#.#.#.###.#",
"#.#...#...#",
"#.###...#D#",
"#Q........#",
"###########"
]
];

const qs=[
{q:"Cari FSTB bagi 8 dan 12.",a:4},
{q:"Cari FSTB bagi 10 dan 15.",a:5},
{q:"Cari FSTB bagi 12 dan 18.",a:6},
{q:"Cari FSTB bagi 6, 12 dan 18.",a:6},
{q:"12 biji epal dan 16 biji oren dibahagikan kepada kumpulan sama banyak tanpa baki. Berapakah bilangan kumpulan maksimum?",a:4}
];

let level=0,lives=3,score=0,time=120;
let player={x:1,y:1},questionDone=false,gameOver=false;
let timer=null;

function startTimer(){
 clearInterval(timer);
 timer=setInterval(()=>{
  if(gameOver)return;
  time--;
  document.getElementById("time").textContent=time;
  if(time<=0){
   clearInterval(timer);
   endGame("⏰ Masa tamat! Cuba lagi.");
  }
 },1000);
}

function draw(){
 const maze=document.getElementById("maze");
 maze.innerHTML="";
 const map=maps[level];
 for(let y=0;y<map.length;y++){
  for(let x=0;x<map[y].length;x++){
   let c=document.createElement("div");
   c.className="cell";
   let tile=map[y][x];
   if(tile==="#"){c.classList.add("wall");c.textContent="";}
   else if(tile==="D"){c.classList.add("door");c.textContent="🚪";}
   else if(tile==="Q"){
    c.classList.add("question");
    c.textContent=questionDone?"✅":"❓";
   }
   else c.textContent="";
   if(player.x===x&&player.y===y){
    c.className="cell player";c.textContent="🧑‍🎓";
   }
   maze.appendChild(c);
  }
 }
 document.getElementById("stage").textContent="Stage "+(level+1)+"/5";
 document.getElementById("lives").textContent=lives;
 document.getElementById("score").textContent=score;
}

function move(dx,dy){
 if(gameOver||document.getElementById("panel").style.display==="flex")return;
 const map=maps[level],nx=player.x+dx,ny=player.y+dy;
 if(!map[ny]||!map[ny][nx]||map[ny][nx]==="#")return;
 player={x:nx,y:ny};
 const tile=map[ny][nx];
 draw();
 if(tile==="Q"&&!questionDone)openQuestion();
 else if(tile==="D"){
  if(!questionDone){
   say("🔒 Jawab soalan dahulu untuk membuka pintu!");
  }else nextStage();
 }
}

function say(s){document.getElementById("message").textContent=s}

function openQuestion(){
 document.getElementById("panelTitle").textContent="🔐 Soalan Stage "+(level+1);
 document.getElementById("questionText").textContent=qs[level].q;
 document.getElementById("answer").value="";
 document.getElementById("feedback").textContent="";
 document.getElementById("panel").style.display="flex";
 document.getElementById("answer").focus();
}

function checkAnswer(){
 let v=document.getElementById("answer").value.trim();
 if(v===""){document.getElementById("feedback").textContent="Masukkan jawapan dahulu!";return}
 if(Number(v)===qs[level].a){
  questionDone=true;score++;
  document.getElementById("panel").style.display="none";
  draw();
  say("✅ Betul! Cari pintu 🚪 untuk ke stage seterusnya.");
 }else{
  lives--;
  document.getElementById("lives").textContent=lives;
  document.getElementById("feedback").textContent="❌ Salah! Cuba lagi. Nyawa tinggal "+lives+".";
  if(lives<=0){
   document.getElementById("panel").style.display="none";
   endGame("💔 Nyawa habis! Tekan Mula Semula.");
  }
 }
}

function nextStage(){
 if(level===4){
  gameOver=true;clearInterval(timer);
  document.getElementById("panelTitle").textContent="🏆 TAHNIAH!";
  document.getElementById("questionText").textContent="Kau berjaya melepasi semua 5 stage FSTB! Markah: "+score+"/5";
  document.getElementById("answer").style.display="none";
  document.getElementById("send").style.display="none";
  document.getElementById("feedback").textContent="Tekan Mula Semula untuk bermain lagi.";
  document.getElementById("panel").style.display="flex";
  say("🏆 Misi selesai!");
  return;
 }
 level++;questionDone=false;player={x:1,y:1};
 draw();say("🎉 Stage seterusnya! Cari soalan baharu.");
}

function endGame(msg){
 gameOver=true;clearInterval(timer);say(msg);
}

function restart(){
 level=0;lives=3;score=0;time=120;questionDone=false;gameOver=false;
 player={x:1,y:1};
 document.getElementById("panel").style.display="none";
 document.getElementById("answer").style.display="inline-block";
 document.getElementById("send").style.display="inline-block";
 draw();say("Cari soalan, jawab dengan betul dan cari pintu!");
 startTimer();
}

document.getElementById("answer").addEventListener("keydown",e=>{
 if(e.key==="Enter")checkAnswer();
});
document.addEventListener("keydown",e=>{
 if(document.getElementById("panel").style.display==="flex")return;
 const k=e.key.toLowerCase();
 if(k==="arrowup"||k==="w")move(0,-1);
 if(k==="arrowdown"||k==="s")move(0,1);
 if(k==="arrowleft"||k==="a")move(-1,0);
 if(k==="arrowright"||k==="d")move(1,0);
});
function init(){draw();startTimer()}
function endInit(){init()}
init();
</script>
</body>
</html>
