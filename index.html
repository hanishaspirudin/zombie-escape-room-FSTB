
<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Misi Escape Room: Kod FSTB</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101629;color:white;font-family:Arial;text-align:center}
header{padding:12px;background:#202d48}
h1{color:#ffd166;font-size:25px;margin:8px}
.stats{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;margin:12px}
#game{width:min(94vw,640px);height:auto;border:4px solid #7184a8;border-radius:8px;image-rendering:pixelated;background:#263c43}
p{margin:10px}
.controls{display:grid;grid-template-columns:58px 58px 58px;gap:5px;justify-content:center;margin:12px}
button{background:#ffd166;border:0;border-radius:9px;padding:13px;font-size:19px;font-weight:bold;cursor:pointer;touch-action:manipulation}
.controls button{height:53px}
#up{grid-column:2}
#left{grid-column:1;grid-row:2}
#down{grid-column:2;grid-row:2}
#right{grid-column:3;grid-row:2}
#message{min-height:26px;color:#ffe29a;font-weight:bold}
#panel{display:none;position:fixed;inset:0;background:#000b;align-items:center;justify-content:center;padding:18px}
.box{background:#202d48;border:2px solid #ffd166;border-radius:16px;padding:24px;width:min(100%,360px)}
#answer{width:100px;padding:10px;font-size:20px;margin:12px}
.small{font-size:13px;color:#c4d0e7}
</style>
</head>
<body>
<header>
<h1>🔐 MISI ESCAPE ROOM</h1>
<div>KOD FSTB · Matematik Tingkatan 1</div>
</header>

<div class="stats">
<span>❤️ Nyawa: <b id="lives">3</b></span>
<span>⭐ Markah: <b id="score">0</b></span>
<span>⏱️ Masa: <b id="time">120</b>s</span>
</div>

<canvas id="game" width="480" height="320"></canvas>
<p id="message">Cari kunci 🗝️, kemudian pergi ke pintu!</p>
<p class="small">Guna WASD / anak panah atau butang di bawah.</p>

<div class="controls">
<button id="up">⬆️</button>
<button id="left">⬅️</button>
<button id="down">⬇️</button>
<button id="right">➡️</button>
</div>

<button onclick="restart()">🔄 Mula Semula</button>

<div id="panel">
<div class="box">
<h2 id="panelTitle">🔒 Pintu Berkunci</h2>
<p id="question"></p>
<input id="answer" type="number" placeholder="Jawapan">
<br>
<button id="submit">Semak Jawapan</button>
<p id="feedback"></p>
<button onclick="closePanel()">Sambung</button>
</div>
</div>

<script>
const c=document.getElementById("game");
const ctx=c.getContext("2d");
const $=id=>document.getElementById(id);

let player={x:35,y:35,size:18};
let key={x:420,y:55};
let hasKey=false,score=0,lives=3,time=120;
let level=0,ended=false,asking=false;
let opened=[],last=0;
let questions=[
 {q:"Cari FSTB bagi 12 dan 18.",a:6},
 {q:"Cari FSTB bagi 20 dan 30.",a:10},
 {q:"Cari FSTB bagi 24 dan 36.",a:12}
];
let walls=[
 {x:100,y:0,w:12,h:200},
 {x:200,y:120,w:12,h:200},
 {x:300,y:0,w:12,h:180},
 {x:100,y:200,w:112,h:12},
 {x:300,y:220,w:120,h:12}
];

function draw(){
 ctx.clearRect(0,0,480,320);
 ctx.fillStyle="#29464a";ctx.fillRect(0,0,480,320);
 // Lantai gaya retro
 for(let y=0;y<320;y+=32)for(let x=0;x<480;x+=32){
  ctx.strokeStyle="#35565a";ctx.strokeRect(x,y,32,32);
 }
 // Dinding
 walls.forEach(w=>{
  ctx.fillStyle="#7184a8";ctx.fillRect(w.x,w.y,w.w,w.h);
  ctx.fillStyle="#93a4c2";ctx.fillRect(w.x,w.y,w.w,4);
 });
 // Pintu keluar
 ctx.fillStyle=hasKey?"#20c997":"#b94b59";
 ctx.fillRect(430,250,34,55);
 ctx.fillStyle="white";ctx.font="12px Arial";
 ctx.fillText("PINTU",428,244);
 // Kunci
 if(!hasKey){
  ctx.font="25px Arial";ctx.fillText("🗝️",key.x,key.y);
 }
 // Watak
 ctx.fillStyle="#ffd166";
 ctx.fillRect(player.x,player.y,player.size,player.size);
 ctx.fillStyle="#172033";
 ctx.fillRect(player.x+4,player.y+4,3,3);
 ctx.fillRect(player.x+12,player.y+4,3,3);
 ctx.fillStyle="#e98a65";
 ctx.fillRect(player.x+5,player.y+12,9,3);
}

function hits(x,y){
 if(x<0||y<0||x+18>480||y+18>320)return true;
 return walls.some(w=>x<w.x+w.w&&x+18>w.x&&y<w.y+w.h&&y+18>w.y);
}

function move(dx,dy){
 if(ended||asking)return;
 let nx=player.x+dx,ny=player.y+dy;
 if(!hits(nx,player.y))player.x=nx;
 if(!hits(player.x,ny))player.y=ny;

 if(!hasKey&&Math.abs(player.x-key.x)<22&&Math.abs(player.y-key.y)<22){
  hasKey=true;
  $("message").textContent="Kunci dijumpai! Pergi ke pintu merah/hijau.";
 }
 if(player.x>410&&player.y>235&&hasKey){
  asking=true;
  $("panelTitle").textContent="🔐 Cabaran FSTB";
  $("question").textContent=questions[level].q;
  $("answer").value="";
  $("feedback").textContent="";
  $("panel").style.display="flex";
  $("answer").focus();
 }
 draw();
}

function closePanel(){
 if(!ended)$("panel").style.display="none";
 asking=false;
}

$("submit").onclick=()=>{
 if(ended)return;
 let val=$("answer").value;
 if(val===""){$("feedback").textContent="Masukkan jawapan dahulu!";return}
 if(Number(val)===questions[level].a){
  score+=10;
  level++;
  $("score").textContent=score;
  $("feedback").textContent="Betul! Pintu berjaya dibuka! 🎉";
  if(level===questions.length){
   finish("🏆 TAHNIAH! MISI SELESAI!");
   return;
  }
  setTimeout(()=>{
   hasKey=false;
   key={x:50+Math.random()*360,y:40+Math.random()*230};
   player={x:25,y:25,size:18};
   $("panel").style.display="none";
   asking=false;
   $("message").textContent="Bilik seterusnya! Cari kunci baru.";
   draw();
  },900);
 }else{
  lives--;
  $("lives").textContent=lives;
  $("feedback").textContent="Belum betul! Cuba lagi.";
  if(lives<=0)finish("💔 Nyawa habis! Cuba lagi.");
 }
};

function finish(msg){
 ended=true;
 $("panelTitle").textContent=msg;
 $("question").textContent="Markah akhir: "+score;
 $("answer").style.display="none";
 $("submit").style.display="none";
 $("feedback").textContent="Tekan Mula Semula untuk bermain lagi.";
 $("panel").style.display="flex";
}

function restart(){
 player={x:35,y:35,size:18};
 key={x:420,y:55};
 hasKey=false;score=0;lives=3;time=120;level=0;
 ended=false;asking=false;
 $("lives").textContent=lives;
 $("score").textContent=score;
 $("time").textContent=time;
 $("answer").style.display="";
 $("submit").style.display="";
 $("panel").style.display="none";
 $("message").textContent="Cari kunci, kemudian pergi ke pintu!";
 draw();
}

document.addEventListener("keydown",e=>{
 const k=e.key.toLowerCase();
 const map={arrowup:[0,-12],w:[0,-12],arrowdown:[0,12],s:[0,12],
 arrowleft:[-12,0],a:[-12,0],arrowright:[12,0],d:[12,0]};
 if(map[k]){
  e.preventDefault();
  move(...map[k]);
 }
 if(k==="enter"&&asking)$("submit").click();
});

[["up",0,-12],["down",0,12],["left",-12,0],["right",12,0]]
.forEach(([id,dx,dy])=>{
 $(id).addEventListener("click",()=>move(dx,dy));
});

setInterval(()=>{
 if(ended)return;
 if(!asking){
  time--;
  $("time").textContent=time;
  if(time<=0)finish("⏰ Masa tamat!");
 }
},1000);

draw();
</script>
</body>
</html>
